name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: chmod +x scripts/build-binaries.sh && ./scripts/build-binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clinkctl-binaries
          path: dist/clinkctl-*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clinkctl-*
